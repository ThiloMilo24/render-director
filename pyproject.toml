[project]
name = "archviz-render-director"
version = "0.1.0"
description = "Render Director: director-generator-validator pipeline that turns BIM renders into photorealistic architectural visualizations."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.95.0",
    "google-genai>=1.73.1",
    "openai>=1.99.0",
    "pillow>=12.2.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.20",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/render_director"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
