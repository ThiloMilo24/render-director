name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No API keys in this environment — the suite runs against the mock
      # providers, and a test that needed a key could not pass here.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q
